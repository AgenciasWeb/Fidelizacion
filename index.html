<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'unsafe-inline'; connect-src https://bnyfhoxrezvotfktrxmb.supabase.co; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; media-src blob: mediastream:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarjeta de sellos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
:root{--bg:#f6f1ea;--card:#fffdf9;--ink:#2a2118;--mute:#7a6c5d;--line:#e4d9cb;--ac:#c2410c;--ac2:#c2410c;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#1c1713;--card:#272019;--ink:#f3ebe0;--mute:#a8998a;--line:#3a3128}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif;min-height:100vh}
main{max-width:440px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;margin:8px 0 2px}h2{font-size:19px;margin:0 0 10px}
p{margin:0 0 12px}.mute{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
input,button{font:inherit}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=color]{padding:2px;height:44px}
button{padding:13px 16px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:700;width:100%;margin-top:12px;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.sm{width:auto;padding:8px 12px;margin:0;font-size:14px}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}
.s{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:20px;color:#fff}
.s.on{background:linear-gradient(135deg,var(--ac),var(--ac2));border:2px solid var(--ac);animation:pop .3s}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.s.on{animation:none}}
.qr{width:170px;margin:8px auto;background:#fff;padding:8px;border-radius:10px}
.qr svg{width:100%;height:auto;display:block}
.code{text-align:center;font:700 26px/1 ui-monospace,monospace;letter-spacing:.2em}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{margin:0;background:transparent;color:var(--ink);border:1px solid var(--line);padding:10px 2px;font-size:13px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.msg{padding:12px;border-radius:10px;margin-top:12px;font-weight:700}
.ok{background:#16a34a22;color:#15803d}.err{background:#dc262622;color:#b91c1c}
@media (prefers-color-scheme:dark){.ok{color:#4ade80}.err{color:#f87171}}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}.stat b{display:block;font-size:26px}
a.btn{display:inline-block;text-align:center;text-decoration:none;padding:13px 16px;border-radius:10px;background:var(--ac);color:#fff;font-weight:700}
a.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}a.btn.sm{padding:8px 12px;font-size:14px}
.wcard{display:block;text-decoration:none;color:#fff;border-radius:14px;padding:18px}
.wcard b{display:block;font-size:20px}.wcard span{display:block;font-size:30px;font-weight:700;margin:6px 0}.wcard small{opacity:.92}
.wrm{text-align:right;margin:6px 0 16px}
.notice{border-left:4px solid var(--ac)}
@media print{.noprint{display:none}body{background:#fff;color:#000}}
video{width:100%;border-radius:10px;margin-top:10px;background:#000}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ====== CONFIGURACIÓN: pegá tus datos de Supabase (Project Settings > API) ====== */
const SUPABASE_URL = "https://bnyfhoxrezvotfktrxmb.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJueWZob3hyZXp2b3Rma3RyeG1iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNDg4MTksImV4cCI6MjEwNzgyNDgxOX0.SGefb4yHOduAs-IN-CgvkzDMt9gP3XBs7xW17VgXjoQ";
/* ================================================================================ */

const $app = document.getElementById('app');
const qs = new URLSearchParams(location.search);
const isPanel = qs.has('panel');
let _s = ''; try { _s = localStorage.getItem('panel_slug') || ''; } catch {}
const slug = (qs.get('b') || (isPanel ? _s : '')).toLowerCase();
let biz = null, pin = sessionStorage.getItem('pin_' + slug) || '', stream = null, poll = null;

async function rpc(fn, args) {
  const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args)
  });
  const d = await r.json().catch(() => null);
  if (!r.ok) throw new Error((d && d.message) || 'Error de conexión');
  if (d && d.error) throw new Error(d.error);
  return d;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hexOk = x => /^#[0-9a-f]{6}$/i.test(x || '');
const setColor = (c, c2) => { const a = hexOk(c) ? c : '#c2410c'; document.documentElement.style.setProperty('--ac', a); document.documentElement.style.setProperty('--ac2', hexOk(c2) ? c2 : a); };
const flash = (el, t, ok) => { el.innerHTML = `<div class="msg ${ok ? 'ok' : 'err'}">${esc(t)}</div>`; };
function qr(text) { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag(4, 0); }
function stampsGrid(n, on, emoji) {
  let h = '<div class="grid">';
  for (let i = 0; i < n; i++) h += `<div class="s ${i < on ? 'on' : ''}">${i < on ? esc(emoji || '✓') : ''}</div>`;
  return h + '</div>';
}

/* ---------------- CLIENTE ---------------- */
async function customerView() {
  const saved = localStorage.getItem('code_' + slug);
  if (!saved) {
    $app.innerHTML = `<h1>${esc(biz.name)}</h1><p class="mute">Juntá ${biz.stamps_needed} sellos y ganá: ${esc(biz.reward)}.</p>
    <div class="card"><h2>Creá tu tarjeta</h2>${biz.welcome_stamps > 0 ? '<p class="mute">Te regalamos ' + biz.welcome_stamps + ' sello' + (biz.welcome_stamps > 1 ? 's' : '') + ' de bienvenida.</p>' : ''}<p class="mute">Usamos tu nombre y teléfono solo para tu tarjeta de sellos.</p>
    <label for="n">Tu nombre</label><input id="n" autocomplete="name">
    <label for="p">Tu teléfono</label><input id="p" type="tel" autocomplete="tel" placeholder="Con característica, sin 0 ni 15">
    ${biz.ask_birthday ? '<label for="bd">Tu cumpleaños (opcional)</label><input id="bd" type="date">' : ''}
    ${biz.ask_promo ? '<label style="display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:14px"><input type="checkbox" id="pm" style="width:auto;margin-top:3px"> Quiero recibir ofertas y novedades por WhatsApp</label>' : ''}
    <button id="go">Crear mi tarjeta</button><div id="m"></div></div>`;
    document.getElementById('go').onclick = async () => {
      const name = n.value.trim(), phone = p.value.replace(/\D/g, '');
      if (name.length < 2 || phone.length < 6) return flash(m, 'Completá nombre y teléfono', false);
      try { const code = await rpc('register_customer', { p_slug: slug, p_name: name, p_phone: phone, p_birthday: document.getElementById('bd')?.value || null, p_promo: !!document.getElementById('pm')?.checked });
        localStorage.setItem('code_' + slug, code); customerView(); }
      catch (e) { flash(m, e.message, false); }
    };
    return;
  }
  async function draw() {
    try {
      const c = await rpc('get_card', { p_slug: slug, p_code: saved });
      if (!c) { localStorage.removeItem('code_' + slug); return customerView(); }
      const done = c.stamps >= biz.stamps_needed, left = biz.stamps_needed - c.stamps;
      $app.innerHTML = `<h1>${esc(biz.name)}</h1><p class="mute">Hola, ${esc(c.name)}</p>${biz.notice ? '<div class="card notice">' + esc(biz.notice) + '</div>' : ''}
      <div class="card">${stampsGrid(biz.stamps_needed, c.stamps, biz.stamp_emoji)}
      <p style="text-align:center;margin:0"><b>${c.stamps} de ${biz.stamps_needed}</b> sellos</p>
      <p class="mute" style="text-align:center;margin-top:6px">${done ? esc(biz.ready_msg || '¡Completaste la tarjeta! Mostrala para canjear') + ': ' : 'Te faltan ' + left + ' sello' + (left > 1 ? 's' : '') + ' para: '}${esc(biz.reward)}</p></div>
      <div class="card"><p class="mute" style="text-align:center">Mostrá este código al negocio para sumar un sello</p>
      <div class="qr">${qr(c.code)}</div><div class="code">${esc(c.code)}</div>
      <p class="mute" style="text-align:center;margin:12px 0 0">Premios canjeados: ${c.rewards}</p></div>${links()}`;
    } catch (e) { $app.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
  }
  await draw(); poll = setInterval(draw, 10000);
}

/* ---------------- NEGOCIO ---------------- */
function loginView(err) {
  $app.innerHTML = `<h1>Panel de ${esc(biz.name)}</h1><div class="card"><label for="pn">PIN del negocio</label>
  <input id="pn" type="password" inputmode="numeric" autocomplete="current-password"><button id="go">Entrar</button><div id="m">${err ? `<div class="msg err">${esc(err)}</div>` : ''}</div></div>`;
  document.getElementById('go').onclick = async () => {
    try { const b = await rpc('biz_login', { p_slug: slug, p_pin: pn.value }); pin = pn.value; sessionStorage.setItem('pin_' + slug, pin); biz = { ...biz, ...b }; setColor(b.color, b.color2); panel('stamp'); }
    catch (e) { flash(m, e.message, false); }
  };
}
function posterView() {
  document.title = 'Cartel ' + biz.name;
  $app.innerHTML = `<div class="card" style="text-align:center;padding:28px"><h1>${esc(biz.name)}</h1><p style="font-size:18px">Escaneá y sumá sellos en tu tarjeta</p><div class="qr" style="width:280px">${qr(location.origin + location.pathname + '?b=' + slug)}</div><p class="mute">Premio: ${esc(biz.reward)}</p></div><button class="noprint" onclick="window.print()">Imprimir</button>`;
}
function stopCam() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }

function panel(tab) {
  stopCam();
  const T = [['stamp', 'Sumar sello'], ['list', 'Clientes'], ['stats', 'Resumen'], ['cfg', 'Ajustes']];
  $app.innerHTML = `<h1>${esc(biz.name)}</h1><div class="tabs">${T.map(t => `<button class="${t[0] === tab ? 'on' : ''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div><div id="v"></div>`;
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => panel(b.dataset.t));
  ({ stamp: stampTab, list: listTab, stats: statsTab, cfg: cfgTab })[tab]();
}

async function stampTab() {
  v.innerHTML = `<div class="card"><label for="q">Buscar cliente por nombre o teléfono</label><input id="q" autocomplete="off" placeholder="Escribí un nombre">
  ${biz.allow_double ? '<label style="display:flex;gap:8px;align-items:center;font-size:15px;color:var(--ink)"><input type="checkbox" id="dbl" style="width:auto"> Sumar 2 sellos (compra grande)</label>' : ''}<div id="res"></div><div id="m"></div>
  <button class="alt" id="cam">Escanear QR del cliente con la cámara</button><video id="vid" playsinline hidden></video></div>`;
  let L = [];
  const render = () => {
    const t = q.value.trim().toLowerCase();
    const f = L.filter(c => !t || c.name.toLowerCase().includes(t) || c.phone.includes(t) || c.code.toLowerCase() === t).slice(0, 30);
    res.innerHTML = f.length ? f.map(c => {
      const done = c.stamps >= biz.stamps_needed;
      return `<div class="row"><div><b>${esc(c.name)}</b><div class="mute">${esc(c.phone)} · ${c.stamps}/${biz.stamps_needed} sellos</div></div>
      <button class="sm" data-f="${done ? 'biz_redeem' : 'biz_stamp'}" data-c="${esc(c.code)}">${done ? 'Canjear premio' : '+ Sello'}</button></div>`;
    }).join('') : '<p class="mute" style="margin-top:12px">No hay clientes con ese nombre. Si es nuevo, que cree su tarjeta con el link o la tarjeta NFC.</p>';
    res.querySelectorAll('button').forEach(b => b.onclick = () => act(b.dataset.f, b.dataset.c));
  };
  const load = async () => { try { L = await rpc('biz_customers', { p_slug: slug, p_pin: pin }); render(); } catch (e) { flash(m, e.message, false); } };
  const act = async (fn, code) => {
    try {
      const args = { p_slug: slug, p_pin: pin, p_code: code }; if (fn === 'biz_stamp') args.p_qty = document.getElementById('dbl')?.checked ? 2 : 1;
      const r = await rpc(fn, args);
      flash(m, fn === 'biz_stamp' ? `Sello sumado a ${r.name}: ${r.stamps} de ${r.needed}` : `Premio canjeado: ${r.name}. Tarjeta reiniciada`, true);
      q.value = ''; stopCam(); vid.hidden = true; load();
      if (fn === 'biz_stamp') { m.insertAdjacentHTML('beforeend', '<button class="alt" id="und">Deshacer este sello</button>');
        und.onclick = async () => { try { await rpc('biz_undo', { p_slug: slug, p_pin: pin, p_code: code }); flash(m, 'Sello deshecho', true); load(); } catch (e) { flash(m, e.message, false); } }; }
    } catch (e) { flash(m, e.message, false); }
  };
  q.oninput = render; load();
  cam.onclick = async () => {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      vid.srcObject = stream; vid.hidden = false; await vid.play();
      const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
      (function scan() {
        if (!stream) return;
        if (vid.videoWidth) { cv.width = vid.videoWidth; cv.height = vid.videoHeight; cx.drawImage(vid, 0, 0);
          const r = jsQR(cx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height);
          if (r && /^[A-Z0-9]{6,8}$/i.test(r.data)) { return act('biz_stamp', r.data.toUpperCase()); } }
        requestAnimationFrame(scan);
      })();
    } catch { flash(m, 'No se pudo abrir la cámara. Buscá al cliente por nombre', false); }
  };
}

let inst = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); inst = e; const c = document.getElementById('inst'); if (c) c.innerHTML = installHtml(); });
function installApp() { if (inst) inst.prompt(); }
function setManifest(kind) {
  let l = document.querySelector('link[rel=manifest]');
  if (!l) { l = document.createElement('link'); l.rel = 'manifest'; document.head.appendChild(l); }
  l.href = kind === 'panel' ? 'manifest-panel.json' : 'manifest.json';
}
function installHtml(wallet) {
  return inst ? '<button onclick="installApp()" style="margin-top:0">Agregar a mi celular</button>'
    : `<p class="mute" style="text-align:center;margin:0">${wallet ? 'Para tenerla a mano: en el menú del navegador tocá “Agregar a pantalla de inicio”. Se instala como “Mis tarjetas”.' : 'Para instalar la app, tocá “Ver todas mis tarjetas” y agregala a la pantalla de inicio desde ahí.'}</p>`;
}
function links() {
  return `<div class="card">${installHtml(false)}<a class="btn alt" style="display:block;margin-top:12px" href="?mis-tarjetas">Ver todas mis tarjetas</a></div>`;
}

async function statsTab() {
  v.innerHTML = '<p class="mute">Cargando…</p>';
  try {
    const [S, L] = await Promise.all([rpc('biz_stats', { p_slug: slug, p_pin: pin }), rpc('biz_customers', { p_slug: slug, p_pin: pin })]);
    const old = L.filter(c => Date.now() - new Date(c.last_seen) > 30 * 864e5);
    const top = [...L].filter(c => c.visits > 0).sort((a, b) => b.visits - a.visits).slice(0, 5);
    const day0 = new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
    const bds = L.filter(c => c.birthday).map(c => { const [m, d] = c.birthday.split('-').map(Number); let t = new Date(day0.getFullYear(), m - 1, d); if (t < day0) t = new Date(day0.getFullYear() + 1, m - 1, d); return { c, days: Math.round((t - day0) / 864e5) }; }).filter(x => x.days <= 7).sort((a, b) => a.days - b.days);
    const waLink = (phone, t) => { let d = phone.replace(/\D/g, '').replace(/^0+/, ''); if (!d.startsWith('54')) d = '549' + d; return 'https://wa.me/' + d + '?text=' + encodeURIComponent(t); };
    const wa = c => {
      let d = c.phone.replace(/\D/g, '').replace(/^0+/, ''); if (!d.startsWith('54')) d = '549' + d;
      const left = biz.stamps_needed - c.stamps;
      const t = `Hola ${c.name.split(' ')[0]}, te esperamos en ${biz.name}! ` + (c.stamps > 0 && left > 0 ? `Te faltan ${left} sellos para tu premio: ${biz.reward}.` : 'Tu tarjeta de sellos te está esperando.');
      return 'https://wa.me/' + d + '?text=' + encodeURIComponent(t);
    };
    v.innerHTML = `<div class="card"><div class="stats">
      <div class="stat"><b>${L.length}</b>clientes</div><div class="stat"><b>${S.today}</b>sellos hoy</div>
      <div class="stat"><b>${S.week}</b>sellos en 7 días</div><div class="stat"><b>${S.redeemed}</b>premios canjeados</div></div></div>
    <div class="card"><h2>Mejores clientes</h2>${top.length ? top.map(c => `<div class="row"><b>${esc(c.name)}</b><span>${c.visits} visitas</span></div>`).join('') : '<p class="mute">Todavía no hay datos.</p>'}</div>
    ${!biz.ask_birthday ? '' : `<div class="card"><h2>Cumplen esta semana</h2>${bds.length ? bds.map(x => `<div class="row"><div><b>${esc(x.c.name)}</b><div class="mute">${x.days === 0 ? 'Hoy' : 'En ' + x.days + ' día' + (x.days > 1 ? 's' : '')}</div></div>${(x.c.promo_ok || !biz.ask_promo) ? '<a class="btn sm" target="_blank" rel="noopener" href="' + waLink(x.c.phone, '¡Feliz cumpleaños, ' + x.c.name.split(' ')[0] + '! Te saludamos de ' + biz.name + '.') + '">Saludar</a>' : (biz.ask_promo ? '<span class="mute">No aceptó mensajes</span>' : '')}</div>`).join('') : '<p class="mute">Nadie por ahora.</p>'}</div>`}
    <div class="card"><h2>Hace más de 30 días que no vienen</h2>${old.length ? old.map(c => `<div class="row"><div><b>${esc(c.name)}</b><div class="mute">${c.stamps}/${biz.stamps_needed} sellos</div></div>${(c.promo_ok || !biz.ask_promo) ? '<a class="btn sm" target="_blank" rel="noopener" href="' + wa(c) + '">WhatsApp</a>' : (biz.ask_promo ? '<span class="mute">No aceptó ofertas</span>' : '')}</div>`).join('') : '<p class="mute">Nadie por ahora. Buena señal.</p>'}</div>`;
  } catch (e) { v.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
}

const savedCards = () => {
  try { return Object.keys(localStorage).filter(k => k.startsWith('code_')).map(k => [k.slice(5), localStorage.getItem(k)]); } catch { return []; }
};
async function walletView() {
  setManifest('wallet');
  document.title = 'Mis tarjetas';
  $app.innerHTML = '<h1>Mis tarjetas</h1><p class="mute">Todas tus tarjetas de sellos en un solo lugar.</p><div id="w"></div>';
  const w = document.getElementById('w'), list = savedCards();
  if (!list.length) { w.innerHTML = '<div class="card"><p class="mute" style="margin:0">Todavía no tenés tarjetas en este celular. Acercá el celular a la tarjeta NFC de un negocio y creá la tuya.</p></div>'; return; }
  w.innerHTML = '<p class="mute">Cargando…</p>';
  const rows = await Promise.all(list.map(async ([sl, code]) => {
    try {
      const [b, c] = await Promise.all([rpc('get_business', { p_slug: sl }), rpc('get_card', { p_slug: sl, p_code: code })]);
      return b && c ? { sl, b, c } : { sl, gone: true };
    } catch { return { sl, err: true }; }
  }));
  w.innerHTML = rows.map(r => {
    let card;
    if (r.gone || r.err) card = `<div class="card" style="margin:0"><b>${esc(r.sl)}</b><p class="mute" style="margin:6px 0 0">${r.gone ? 'Esta tarjeta ya no existe.' : 'No se pudo cargar. Revisá tu conexión.'}</p></div>`;
    else {
      const col = hexOk(r.b.color) ? r.b.color : '#c2410c', col2 = hexOk(r.b.color2) ? r.b.color2 : col, left = r.b.stamps_needed - r.c.stamps;
      card = `<a class="wcard" href="?b=${encodeURIComponent(r.sl)}" style="background:linear-gradient(135deg,${col},${col2})"><b>${esc(r.b.name)}</b><span>${r.c.stamps} de ${r.b.stamps_needed} sellos</span><small>${left <= 0 ? '¡Premio listo! ' : 'Te faltan ' + left + ' · '}${esc(r.b.reward)}</small></a>`;
    }
    return card + `<div class="wrm"><button class="alt sm" data-rm="${esc(r.sl)}">Quitar de este celular</button></div>`;
  }).join('');
  w.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
    if (confirm('¿Quitar esta tarjeta de este celular? No perdés tus sellos: podés recuperarla con tu teléfono.')) { localStorage.removeItem('code_' + b.dataset.rm); walletView(); }
  });
  w.insertAdjacentHTML('beforeend', '<div class="card" id="inst">' + installHtml(true) + '</div>');
}

async function listTab() {
  v.innerHTML = '<p class="mute">Cargando…</p>';
  try {
    const L = await rpc('biz_customers', { p_slug: slug, p_pin: pin });
    const cell = x => { x = String(x ?? ''); if (/^[=+\-@\t\r]/.test(x)) x = "'" + x; return '"' + x.replace(/"/g, '""') + '"'; };
    v.innerHTML = `<div class="card"><h2>${L.length} cliente${L.length === 1 ? '' : 's'}</h2>` + (L.length
      ? '<button class="alt" id="exp" style="margin:0 0 8px">Descargar lista (Excel / CSV)</button>' + L.map(c =>
        `<div class="row" style="flex-wrap:wrap"><div><b>${esc(c.name)}</b><div class="mute">${esc(c.phone)} · ${c.stamps}/${biz.stamps_needed} sellos</div></div><button class="alt sm" data-h="${esc(c.code)}">Historial</button><div id="h-${esc(c.code)}" style="width:100%"></div></div>`).join('')
      : '<p class="mute">Todavía nadie creó su tarjeta. Compartí el link o la tarjeta NFC.</p>') + '</div>';
    const ex = document.getElementById('exp');
    if (ex) ex.onclick = () => {
      const rows = [['Nombre', 'Teléfono', 'Sellos', 'Premios canjeados', 'Visitas', 'Última visita', 'Cumpleaños', 'Acepta ofertas']].concat(
        L.map(c => [c.name, c.phone, c.stamps, c.rewards, c.visits, new Date(c.last_seen).toLocaleDateString('es-AR'), c.birthday || '', c.promo_ok ? 'Sí' : 'No']));
      const blob = new Blob(['\ufeff' + rows.map(r => r.map(cell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'clientes-' + slug + '.csv'; a.click();
    };
    v.querySelectorAll('[data-h]').forEach(b => b.onclick = async () => {
      const box = document.getElementById('h-' + b.dataset.h);
      if (box.innerHTML) { box.innerHTML = ''; return; }
      try {
        const H = await rpc('biz_history', { p_slug: slug, p_pin: pin, p_code: b.dataset.h });
        box.innerHTML = H.length ? H.map(h => `<div class="mute" style="padding:4px 0">${new Date(h.at).toLocaleString('es-AR')} · ${h.kind === 'redeem' ? 'Premio canjeado' : '+' + h.qty + ' sello' + (h.qty > 1 ? 's' : '')}</div>`).join('') : '<div class="mute">Sin movimientos</div>';
      } catch (e) { box.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
    });
  } catch (e) { v.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
}

function cfgTab() {
  v.innerHTML = `<div class="card"><h2>Configurar tarjeta</h2>
  <label for="c1">Nombre del negocio</label><input id="c1" value="${esc(biz.name)}">
  <label for="c2">Sellos para el premio (2 a 30)</label><input id="c2" type="number" min="2" max="30" value="${biz.stamps_needed}">
  <label for="c3">Premio</label><input id="c3" value="${esc(biz.reward)}">
  <label for="c4">Color de la tarjeta</label><input id="c4" type="color" value="${esc(biz.color)}">
  <label for="c13">Segundo color (para degradé; igual al primero = sin degradé)</label><input id="c13" type="color" value="${esc(biz.color2 || biz.color)}">
  <label for="c12">Emoji del sello</label><input id="c12" maxlength="8" value="${esc(biz.stamp_emoji || '⭐')}">
  <div id="pv"></div>
  <label for="c14">Aviso para tus clientes (arriba de la tarjeta; vacío = ninguno)</label><input id="c14" maxlength="120" value="${esc(biz.notice || '')}" placeholder="Hoy 2x1 en café">
  <label for="c15">Mensaje cuando el premio está listo (opcional)</label><input id="c15" maxlength="80" value="${esc(biz.ready_msg || '')}" placeholder="¡Tenés un café gratis!">
  <label for="c5">Minutos mínimos entre sellos del mismo cliente (0 = sin límite)</label><input id="c5" type="number" min="0" value="${biz.min_minutes}">
    <label for="c9">Los sellos vencen después de X días sin venir (0 = nunca)</label><input id="c9" type="number" min="0" value="${biz.expiry_days}">
  <label for="c10">Sellos de regalo al crear la tarjeta (0 a 5)</label><input id="c10" type="number" min="0" max="5" value="${biz.welcome_stamps || 0}">
  <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="c11" style="width:auto" ${biz.allow_double ? 'checked' : ''}> Permitir sumar 2 sellos en una compra</label>
  <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="c16" style="width:auto" ${biz.ask_birthday ? 'checked' : ''}> Pedir el cumpleaños al crear la tarjeta</label>
  <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="c17" style="width:auto" ${biz.ask_promo ? 'checked' : ''}> Pedir permiso para enviar ofertas por WhatsApp</label>
  <label for="c6">Nuevo PIN (6 a 12 números; vacío = no cambiarlo)</label><input id="c6" type="password" inputmode="numeric">
  <button id="sv">Guardar cambios</button><button class="alt" onclick="sessionStorage.removeItem('pin_'+slug);location.reload()">Cerrar sesión</button><div id="m"></div>
  <p class="mute" style="margin-top:14px">Link de tu tarjeta para clientes:<br><b>${esc(location.origin + location.pathname)}?b=${esc(slug)}</b></p><a class="btn alt" style="display:block;margin-top:8px" target="_blank" href="?b=${esc(slug)}&cartel=1">Imprimir cartel con QR</a></div>`;
  const pv = () => { const e = document.getElementById('pv'); e.style.setProperty('--ac', c4.value); e.style.setProperty('--ac2', c13.value); e.innerHTML = stampsGrid(6, 3, c12.value.trim() || '⭐'); };
  [c4, c12, c13].forEach(i => i.oninput = pv); pv();
  sv.onclick = async () => {
    const a = { p_slug: slug, p_pin: pin, p_name: c1.value.trim() || biz.name, p_needed: +c2.value, p_reward: c3.value.trim() || 'Premio', p_color: c4.value, p_minutes: +c5.value || 0, p_new_pin: c6.value, p_expiry: +c9.value || 0, p_welcome: +c10.value || 0, p_double: c11.checked, p_emoji: c12.value.trim() || '⭐', p_color2: c13.value, p_notice: c14.value.trim(), p_ready: c15.value.trim(), p_ask_bday: c16.checked, p_ask_promo: c17.checked };
    try { await rpc('biz_update', a); if (c6.value) { pin = c6.value; sessionStorage.setItem('pin_' + slug, pin); }
      biz = { ...biz, name: a.p_name, stamps_needed: a.p_needed, reward: a.p_reward, color: a.p_color, min_minutes: a.p_minutes, expiry_days: a.p_expiry, welcome_stamps: a.p_welcome, allow_double: a.p_double, stamp_emoji: a.p_emoji, color2: a.p_color2, notice: a.p_notice, ready_msg: a.p_ready, ask_birthday: a.p_ask_bday, ask_promo: a.p_ask_promo }; setColor(a.p_color, a.p_color2); flash(m, 'Cambios guardados', true); }
    catch (e) { flash(m, e.message, false); }
  };
}

/* ---------------- ARRANQUE ---------------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
(async () => {
  if (isPanel && !slug) {
    setManifest('panel'); document.title = 'Panel de sellos';
    $app.innerHTML = '<h1>Panel de sellos</h1><div class="card"><label for="sg">Código de tu negocio</label><input id="sg" autocapitalize="none" placeholder="ej: micafe"><button id="go">Continuar</button><div id="m"></div></div>';
    go.onclick = () => { const v = sg.value.trim().toLowerCase(); if (/^[a-z0-9-]{2,40}$/.test(v)) location.href = '?b=' + v + '&panel=1'; else flash(m, 'Código inválido', false); };
    return;
  }
  if (qs.has('mis-tarjetas') || (!slug && savedCards().length)) return walletView();
  if (!slug) { $app.innerHTML = '<h1>Tarjeta de sellos</h1><p class="mute">Falta el negocio en el link. Usá: ?b=nombre-del-negocio</p>'; return; }
  try {
    biz = await rpc('get_business', { p_slug: slug });
    if (!biz) { $app.innerHTML = '<div class="msg err">Negocio no encontrado</div>'; return; }
    setColor(biz.color, biz.color2);
    if (isPanel) { document.title = biz.name; setManifest('panel'); try { localStorage.setItem('panel_slug', slug); } catch {} }
    else { document.title = 'Mis tarjetas'; setManifest('wallet'); }
    if (qs.has('cartel')) return posterView();
    if (!isPanel) return customerView();
    if (pin) { try { const b = await rpc('biz_login', { p_slug: slug, p_pin: pin }); biz = { ...biz, ...b }; return panel('stamp'); } catch {} }
    loginView();
  } catch (e) { $app.innerHTML = `<div class="msg err">${esc(e.message)}. Revisá la configuración de Supabase.</div>`; }
})();
</script>
</body>
