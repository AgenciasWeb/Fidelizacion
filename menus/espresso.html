<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adryss — Café gratis</title><style>
:root{--c:#8a4b2a;--bg:#f6f1ea;--ink:#1a1a1a;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:0;align-items:center;background:linear-gradient(135deg,#fdf5e6 0%,#f6f1ea 100%);min-height:92vh}
.hero img{width:100%;height:100%;object-fit:cover;display:block;min-height:320px}
.hero div{padding:3rem 2rem}
h1{font-size:clamp(2.2rem,5vw,3.5rem);color:var(--c);line-height:1.05;margin-bottom:.5rem}
.subtitle{font-size:1.15rem;color:#555;margin-bottom:1.2rem}
.badge{display:inline-block;background:var(--c);color:#fff;padding:.35rem .9rem;border-radius:9999px;font-weight:700;font-size:.85rem;letter-spacing:.02em}
.p{font-size:1.05rem;color:#333;max-width:42ch}
.btn{display:inline-block;background:var(--c);color:#fff;text-decoration:none;padding:.85rem 2rem;border-radius:.75rem;font-weight:700;margin-top:1.2rem;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
@media(max-width:860px){.hero{grid-template-columns:1fr}.hero img{min-height:220px}}
</style></head>
<body>
<section class="hero" aria-label="Adryss — Café espresso">
  <div>
    <span class="badge">10 sellos • Café gratis</span>
    <h1>Adryss<br><span style="font-weight:400;font-size:.7em;color:#555">Café espresso</span></h1>
    <p class="subtitle">Tu tarjeta de sellos. Cada café cuenta. Juntá 10 y ganá tu premio.</p>
    <p class="p">El café de acá es intenso, con notas de chocolate y un toque de especias. Vení hoy, pasá por el mostrador y sumá tu sello. Te damos el primero de bienvenida.</p>
    <a class="btn" href="?b=adryss&c=5768600A">Ver mi tarjeta</a>
  </div>
  <img src="espresso.jpg" alt="Café espresso servido en taza de cerámica con crema" loading="eager" onerror="this.style.display='none'" />
</section>
</body>
</html>
