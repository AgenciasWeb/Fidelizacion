<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://bnyfhoxrezvotfktrxmb.supabase.co; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; media-src blob: mediastream:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="description" content="Mis tarjetas: todas tus tarjetas de sellos de todos los negocios en un solo lugar.">
<link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis tarjetas</title>
<style>
:root{--ac:#c2410c;--bg:#f6f1ea;--card:#fffdf9;--ink:#2a2118;--mute:#6b5c4d;--line:#e4d9cb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:440px;margin:0 auto;padding:28px 16px 40px}
h1{font-size:24px;margin:0 0 6px}
p{margin:0 0 14px;color:var(--mute)}
button,.btn{display:block;width:100%;padding:14px 16px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;margin-top:12px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.aviso{margin-top:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px;color:var(--mute)}
.aviso b{color:var(--ink)}
</style>
</head>
<body>
<main>
<h1>Mis tarjetas</h1>
<p>Todas tus tarjetas de sellos, de todos los negocios, en un solo lugar.</p>
<button class="btn" id="irapp">Abrir mis tarjetas</button>
<button class="btn alt" id="inst" hidden>Instalar la app Mis tarjetas</button>
<div class="aviso" id="ayuda" hidden></div>
<a class="btn alt" href="../panel/" style="margin-top:22px">¿Sos un negocio? Entrar al panel</a>
</main>
<script>
  document.getElementById('irapp').onclick = function () { location.href = '../?mis-tarjetas'; };

  var btn = document.getElementById('inst'), ayuda = document.getElementById('ayuda');
  var ev = null;
  addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); ev = e; btn.hidden = false; });
  btn.onclick = function () {
    if (ev) { ev.prompt(); ev = null; btn.hidden = true; return; }
    ayuda.hidden = false;
    ayuda.innerHTML = 'Tocá el menú del navegador (⋮ en Android, o <b>Compartir</b> en iPhone) y elegí <b>“Instalar aplicación”</b> o <b>“Agregar a pantalla de inicio”</b>.';
  };
  if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) location.replace('../?mis-tarjetas');
</script>
</body>
</html>
