<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://bnyfhoxrezvotfktrxmb.supabase.co; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; media-src blob: mediastream:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="description" content="Mis tarjetas: todas tus tarjetas de sellos de todos los negocios en un solo lugar.">
<link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis tarjetas</title>
<style>
:root{--ac:#c2410c;--ac2:#ea580c;--ac-ink:#fff;--bg:#f6f1ea;--card:#fffdf9;--ink:#2a2118;--mute:#6b5c4d;--line:#e4d9cb;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#1c1713;--card:#272019;--ink:#f3ebe0;--mute:#b3a493;--line:#3a3128}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;background-image:radial-gradient(circle at 50% -18%,color-mix(in srgb,var(--ac) 20%,transparent),transparent 58%);background-attachment:fixed}
main{max-width:440px;margin:0 auto;padding:28px 16px 40px}
.bhero{position:relative;overflow:hidden;border-radius:20px;padding:26px 20px 24px;margin:0 0 18px;color:var(--ac-ink);box-shadow:0 16px 32px -18px rgba(0,0,0,.65);background-image:radial-gradient(circle at 88% 6%,rgba(255,255,255,.35),transparent 46%),radial-gradient(circle at 4% 96%,rgba(255,255,255,.25),transparent 44%),linear-gradient(135deg,var(--ac),var(--ac2))}
.bhero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(color-mix(in srgb,var(--ac-ink) 32%,transparent) 1.2px,transparent 1.3px);background-size:15px 15px;opacity:.4;pointer-events:none}
.bhero-ico{position:absolute;z-index:1;right:16px;top:16px;width:64px;height:64px;display:grid;place-items:center;font-size:34px;background:color-mix(in srgb,var(--ac-ink) 15%,transparent);border:1px solid color-mix(in srgb,var(--ac-ink) 35%,transparent);border-radius:50%}
.bhero-k{position:relative;z-index:1;margin:0 0 4px;font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;opacity:.92}
.bhero h1{position:relative;z-index:1;margin:0;color:var(--ac-ink);font-size:27px;line-height:1.15;text-shadow:0 1px 8px rgba(0,0,0,.18)}
.bhero-u{position:relative;z-index:1;margin:10px 0 0;font-size:14px;opacity:.94;max-width:78%}
p{margin:0 0 14px;color:var(--mute)}
button,.btn{display:block;width:100%;padding:15px 16px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font:inherit;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;margin-top:12px;transition:transform .12s ease,box-shadow .12s ease,filter .12s ease}
button:not(.alt):hover,.btn:not(.alt):hover{filter:brightness(1.06);box-shadow:0 10px 24px -12px color-mix(in srgb,var(--ac) 85%,transparent)}
button:not(.alt):active{transform:scale(.985)}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.aviso{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:14px;color:var(--mute);box-shadow:0 2px 10px -7px rgba(0,0,0,.4)}
.aviso b{color:var(--ink)}
</style>
</head>
<body>
<main>
<header class="bhero">
  <div class="bhero-ico" aria-hidden="true">🎴</div>
  <p class="bhero-k">App para clientes</p>
  <h1>Mis tarjetas</h1>
  <p class="bhero-u">Todas tus tarjetas de sellos, de todos los negocios, en un solo lugar.</p>
</header>
<button class="btn" id="irapp">Abrir mis tarjetas</button>
<button class="btn alt" id="inst" hidden>Instalar la app Mis tarjetas</button>
<div class="aviso" id="ayuda" hidden></div>
</main>
<script>
  document.getElementById('irapp').onclick = function () { location.href = '../?mis-tarjetas'; };

  var btn = document.getElementById('inst'), ayuda = document.getElementById('ayuda');
  var ev = null;
  addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); ev = e; btn.hidden = false; });
  btn.onclick = function () {
    if (ev) { ev.prompt(); ev = null; btn.hidden = true; return; }
    ayuda.hidden = false;
    ayuda.innerHTML = 'Tocá el menú del navegador (⋮ en Android, o <b>Compartir</b> en iPhone) y elegí <b>“Instalar aplicación”</b> o <b>“Agregar a pantalla de inicio”</b>.';
  };
  if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) location.replace('../?mis-tarjetas');
</script>
</body>
</html>
